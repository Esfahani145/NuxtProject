$kind: http-request
url: "{{host}}/auth/login"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: username
      value: "09111111111"
    - type: text
      key: password
      value: "123456"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    var token = pm.response.json().data.Authorization\r

      \    pm.collectionVariables.set(\"token\", token);\r

      });"
    language: text/javascript
order: 2000
