$kind: http-request
url: "{{host}}/auth/logout"
method: POST
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.collectionVariables.set(\"token\", \"\");\r

      });"
    language: text/javascript
order: 7000
