$kind: http-request
url: "{{host}}/user/profile"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: first_name
      value: my name
      disabled: true
    - type: text
      key: last_name
      value: ""
      disabled: true
