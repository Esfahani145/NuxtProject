$kind: http-request
url: "{{host}}/auth/refresh"
method: POST
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    var token = pm.response.json().data.Authorization\r

      \    pm.collectionVariables.set(\"token\", token);\r

      });"
    language: text/javascript
order: 6000
