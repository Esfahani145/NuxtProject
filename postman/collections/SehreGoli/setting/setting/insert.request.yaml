$kind: http-request
url: "{{host}}/setting/insert"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: key
      value: mixture_type
      description: "*"
    - type: text
      key: value
      value: ادویه ساز
      description: "*"
    - type: text
      key: landing_page_needed
      value: "1"
      description: 1:true , 0:false آیا در صفحه اول سایت به این مقدار این تنظیم نیاز داریم یا خیر
    - type: text
      key: category
      value: ""
    - type: text
      key: sort
      value: ""
order: 3000
