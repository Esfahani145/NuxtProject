$kind: http-request
url: "{{host}}/discount/insert"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: combination_id
      value: ""
      description: "* ای دی تنوع"
    - type: text
      key: discount
      value: "10"
      description: "* مقدار تخفیف (می تواند درصد باشد یا مقدار تومان تخفیف)"
    - type: text
      key: starts_at
      value: ""
      description: "* تاریخ و زمان شروع تخفیف"
    - type: text
      key: ends_at
      value: ""
      description: "* تاریخ و زمان اتمام تخفیف"
    - type: text
      key: code
      value: test-2
      description: کد تخفیف (اگر این فیلد خالی باشد تخفیف روی تمامی خرید های این محصول اعمال می شود و اگر پر باشد فقط در صورت وارد کردن کد تخفیف اعمال می شود)
    - type: text
      key: code_max_discount
      value: "0"
      description: سقف تخفیف برای کد تخفیف های درصدی
    - type: text
      key: code_user_max_usage
      value: ""
      description: حداکثر تعداد استفاده کد برای هر کاربر
    - type: text
      key: code_total_max_usage
      value: ""
      description: حداکثر تعداد استفاده کد در مجموع
    - type: text
      key: code_send_free
      value: "1"
      description: کد شامل ارسال رایگان هم شود یا خیر 1 - 0
    - type: text
      key: type
      value: amount
      description: "* amount , percent"
    - type: text
      key: special_suggestion
      value: "1"
      description: اگر 1 باشد محصول مربوط به این تخفیف در سبد خرید بعنوان پیشنهاد ویژه نمایش داده می شود
    - type: text
      key: sort
      value: ""
order: 4000
