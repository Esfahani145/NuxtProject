$kind: http-request
url: "{{host}}/payment/insert"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: price
      value: ""
      description: "*"
    - type: text
      key: status
      value: ""
      description: "wait , payed , unpayed , reject , cancled "
    - type: text
      key: ref_id
      value: ""
    - type: text
      key: user_id
      value: ""
    - type: text
      key: discount
      value: ""
    - type: text
      key: kind_set
      value: ""
      description: bank , manual
    - type: text
      key: card_num
      value: ""
    - type: text
      key: terminal
      value: ""
    - type: text
      key: authority
      value: ""
    - type: text
      key: basket_id
      value: ""
    - type: text
      key: paid_date
      value: ""
    - type: text
      key: discount_id
      value: ""
    - type: text
      key: discount_section
      value: ""
order: 7000
