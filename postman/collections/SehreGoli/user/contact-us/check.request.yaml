$kind: http-request
url: "{{host}}/contact-us/check"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: id
      value: ""
      description: "*"
    - type: text
      key: checked
      value: "1"
      description: "* 1 / 0"
order: 5000
